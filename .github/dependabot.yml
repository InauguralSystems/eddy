version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group Action bumps into one PR (monorepo sub-actions must move in
    # lockstep; ungrouped they skew CI — see InauguralSystems/EigenScript#485).
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/oracle"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
